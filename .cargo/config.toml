# Every dependency builds from `vendor/`, in this repository, not from a
# registry cache outside it: what the engine is built from is committed, shows
# in a diff and builds offline -- as Godot keeps `thirdparty/` and Unreal
# `ThirdParty/` in their trees. After any change to Cargo.lock, run
# `cargo vendor --locked vendor` and commit what it changes; CI checks that
# the two agree.
#
# And the build output goes where Cargo puts it by default, `target/` beside
# the workspace -- one per worktree, removed with it. It used to be pinned to
# C:\ because v8's build script needs its source and its output on the same
# drive (creating its `gn_root` symlink across drives needs a privilege a
# normal Windows account lacks). With v8's source in `vendor/`, the two are in
# the same tree on every machine, so nothing needs pinning.
[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"

[target.x86_64-pc-windows-msvc]
# wgpu Vulkan layer enumeration exceeds Windows' default 1MB main-thread stack
# in debug builds. 64MB gives ample headroom for both debug and release.
rustflags = ["-C", "link-args=/STACK:67108864"]

[target.wasm32-unknown-unknown]
# getrandom 0.3 picks its wasm backend by cfg, not by feature alone; see the
# wasm32 dependencies in crates/bsengine-core/Cargo.toml.
rustflags = ["--cfg", 'getrandom_backend="wasm_js"']

[env]
# The /STACK: link arg above only sizes the *main* thread. libtest runs every
# #[test] on a spawned thread instead, and Rust passes its own default stack
# size (2 MiB) to CreateThread rather than inheriting the PE header's value —
# so tests never saw that 64MB. 2 MiB isn't enough for V8 (deno_core, reached
# via any scripting test) or bsengine-editor's reflection-heavy suite, which
# made `cargo test --workspace` die with STATUS_STACK_OVERFLOW locally while
# CI stayed green: CI already sets this exact variable inline in
# .github/workflows/ci.yml, so only local runs were affected. Setting it here
# makes local match CI. Deliberately the same 8 MiB value CI uses, not more —
# the point is parity, so a passing local run means a passing CI run. Not
# `force = true`, so CI's explicit env var (and any manual override) still wins.
#
# 16 MiB, not 8, since 2026-10: rustc reads the same variable for its own
# compiler thread, and rustc 1.99 overflows 8 MiB compiling `minidump-common`
# (behind the native crash monitor, `bsengine_core::native_crash`) --
# "thread 'rustc' has overflowed its stack" on Windows, SIGSEGV on Linux --
# where 1.97 did not. 16 MiB was the smallest power of two that compiles it.
RUST_MIN_STACK = "16777216"
