name: CI

on:
  push:
    branches: [master, "feat/**"]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  # Override .cargo/config.toml's Windows-specific target-dir
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          # Cache key includes OS so Windows/Linux don't share V8 artifacts
          key: ${{ matrix.os }}

      # Cache librusty_v8.a keyed by v8 crate version + OS, independent of
      # Cargo.lock so adding unrelated crates never forces a re-download.
      - name: Resolve v8 crate version
        id: v8ver
        shell: bash
        run: |
          VER=$(grep -A 2 'name = "v8"' Cargo.lock | grep 'version =' | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "ver=$VER" >> $GITHUB_OUTPUT

      - name: Cache rusty_v8 prebuilt binary
        id: cache-rusty-v8
        uses: actions/cache@v4
        with:
          path: ~/.rusty_v8
          key: rusty-v8-${{ runner.os }}-${{ steps.v8ver.outputs.ver }}

      - name: Download rusty_v8 (Linux)
        if: matrix.os == 'ubuntu-latest' && steps.cache-rusty-v8.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.rusty_v8
          curl -fL "https://github.com/denoland/rusty_v8/releases/download/v${{ steps.v8ver.outputs.ver }}/librusty_v8_simdutf_release_x86_64-unknown-linux-gnu.a.gz" \
            -o ~/.rusty_v8/librusty_v8.a.gz

      - name: Download rusty_v8 (Windows)
        if: matrix.os == 'windows-latest' && steps.cache-rusty-v8.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.rusty_v8" | Out-Null
          Invoke-WebRequest "https://github.com/denoland/rusty_v8/releases/download/v${{ steps.v8ver.outputs.ver }}/rusty_v8_simdutf_release_x86_64-pc-windows-msvc.lib.gz" `
            -OutFile "$env:USERPROFILE\.rusty_v8\rusty_v8.lib.gz"

      - name: Set RUSTY_V8_ARCHIVE (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: echo "RUSTY_V8_ARCHIVE=$HOME/.rusty_v8/librusty_v8.a.gz" >> $GITHUB_ENV

      - name: Set RUSTY_V8_ARCHIVE (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: echo "RUSTY_V8_ARCHIVE=$env:USERPROFILE\.rusty_v8\rusty_v8.lib.gz" >> $env:GITHUB_ENV

      # GitHub's ubuntu-latest runners pre-configure azure.archive.ubuntu.com
      # as a mirror, and it has been degraded: apt-get update against it hung
      # for 40+ minutes with zero output across 3 consecutive runs (confirmed
      # via live web-UI logs -- archive.ubuntu.com succeeded in the same run).
      # Per-request timeout/retry options (Acquire::http::Timeout, Retries)
      # only partially helped -- a follow-up run still stalled silently for
      # the full 5-minute step timeout on what looks like a DNS/connect-level
      # hang those options don't fully bound. Dropping the broken mirror from
      # apt's sources entirely, in favor of the one already proven to work,
      # is more decisive than tuning timeouts against a host that may not
      # respond at all. `|| true` on the sed calls: harmless if a particular
      # sources file/format doesn't exist (e.g. a future non-noble image).
      # `timeout-minutes` stays as a backstop in case of a *different* future
      # mirror problem.
      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 5
        run: |
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 update
          sudo apt-get install -y mesa-vulkan-drivers libasound2-dev libudev-dev

      - name: Format check
        run: cargo +nightly fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets

      # R1: every public `#[derive(Component)]` type is registered for
      # reflection. An unregistered component is invisible to the Inspector, to
      # `set_reflected_component`, and to reflected scene entries -- it exists
      # but no tool or agent can see or attach it. There is no opt-out list:
      # non-`pub` components are internal by construction and skipped, so
      # visibility is the exception mechanism.
      #
      # R2: no *new* per-axis (`_x`/`_y`/`_z`) scripting ops. The 45 that exist
      # are grandfathered in axis_ops_baseline.txt; this is a ratchet, not a
      # cleanup.
      #
      # This does NOT detect duplication. Whether two components or ops mean the
      # same thing is a judgement -- a green run here is not evidence of a clean
      # design. Ask `catalog --concept <word>` or the `component_catalog` MCP
      # tool for that. See ENGINE_ROADMAP item 32.
      #
      # Cheap and dependency-light (syn only), so it runs before the build and
      # fails fast.
      - name: Component catalogue check
        run: cargo run -p bsengine-catalog --bin catalog -- --check

      - name: Build
        run: cargo build --all

      - name: Test
        env:
          RUST_MIN_STACK: 8388608
        run: cargo test --workspace --exclude bsengine-editor

      - name: Test (editor, isolated)
        env:
          RUST_MIN_STACK: 8388608
        run: cargo test -p bsengine-editor

      # Replays every checked-in E2E recording. These are the only tests that
      # exercise a whole game end to end -- scene loading, scripting, physics,
      # navmesh and combat together -- and nothing else in this workflow runs
      # them, so until now a recording could rot unnoticed for months.
      #
      # Worth running on both runners specifically because they are loaded,
      # shared machines: a recording that advances by a fixed frame count
      # covers a machine-speed-dependent distance, which is exactly the bug
      # that made mini-arena's recording fail here while passing on an idle
      # desktop. Discovered by glob rather than listed, so a newly recorded
      # log is covered the moment it lands.
      #
      # Run via xargs -P rather than sequentially: each replay's pass/fail is
      # driven entirely by simulated frame count (bsengine-runtime --test
      # pins physics/script timing to a fixed 1/60s per frame, decoupled from
      # wall-clock speed since PR #1748; wait_until's own timeout is a frame
      # count, not a real-time duration), so slower per-process wall-clock
      # throughput from shared-runner contention cannot flip a replay's
      # outcome the way the original mini-arena bug did. Each worker writes
      # its own output to a private temp file instead of shared stdout --
      # ::group::/::endgroup:: markers don't nest correctly across concurrent
      # writers -- and the main script prints them back in original order
      # afterward, so the final log looks identical to the sequential
      # version except for the step's total duration. Invokes the
      # already-built binary directly (not `cargo run`) so 8 concurrent
      # invocations don't separately contend for Cargo's own build lock.
      - name: E2E replays
        shell: bash
        env:
          RUST_MIN_STACK: 8388608
        run: |
          bin="$CARGO_TARGET_DIR/debug/bsengine-runtime"
          if [ "$RUNNER_OS" = "Windows" ]; then
            bin="${bin}.exe"
          fi

          logs=()
          for log in games/*/assets/tests/*.testlog.json; do
            [ -e "$log" ] || continue
            logs+=("$log")
          done
          if [ "${#logs[@]}" -eq 0 ]; then
            echo "no recordings matched games/*/assets/tests/*.testlog.json -- the glob is wrong"
            exit 1
          fi

          workdir=$(mktemp -d)
          run_one() {
            local log="$1"
            local project
            project="$(dirname "$(dirname "$(dirname "$log")")")"
            local safe_name
            safe_name="$(echo "$log" | tr '/\\' '__')"
            if "$bin" --test "$project" --replay "$log" > "$workdir/$safe_name.log" 2>&1; then
              echo "PASS" > "$workdir/$safe_name.status"
            else
              echo "FAIL" > "$workdir/$safe_name.status"
            fi
          }
          export -f run_one
          export bin workdir

          # A first attempt used -P "$(nproc)" (full core count) and showed
          # zero wall-clock improvement over the sequential baseline on CI
          # (2h50m20s vs. 2h50m5s) despite a clean ~12.6s local run against
          # real hardware. bsengine-runtime itself is internally
          # multi-threaded (Bevy's task pool, deno_core/V8, wgpu's software
          # rasterizer), so a single replay likely already saturates the
          # runner's CPU on its own -- running 8 at "$(nproc)"-wide
          # parallelism just oversubscribes the same already-saturated pool
          # rather than actually overlapping idle capacity. -P 2 trades some
          # of that oversubscription for a chance at partial overlap instead.
          printf '%s\n' "${logs[@]}" | xargs -P 2 -I{} bash -c 'run_one "$@"' _ {}

          status=0
          for log in "${logs[@]}"; do
            safe_name="$(echo "$log" | tr '/\\' '__')"
            result="$(cat "$workdir/$safe_name.status")"
            echo "::group::$log ($result)"
            cat "$workdir/$safe_name.log"
            echo "::endgroup::"
            if [ "$result" = "FAIL" ]; then
              echo "FAIL $log"
              status=1
            else
              echo "PASS $log"
            fi
          done
          rm -rf "$workdir"
          echo "replayed ${#logs[@]} recording(s)"
          exit $status

      # Packages every project in the repository, not just the one
      # `crates/bsengine-runtime/tests/package.rs` builds and replays. That
      # test proves a packaged build *runs*; this step proves every game's
      # references still resolve, which is the half a single project cannot
      # cover -- a scene renamed out from under a prefab in `tilt-run` would
      # pass the E2E test and fail here. It boots no engine, so it costs
      # seconds.
      - name: Package every project
        shell: bash
        run: |
          bin="$CARGO_TARGET_DIR/debug/bsengine-runtime"
          if [ "$RUNNER_OS" = "Windows" ]; then
            bin="${bin}.exe"
          fi

          # Two levels: `games/net-2p-demo/` is a container holding `client/`
          # and `server/`, each its own project. A `games/*/` glob alone finds
          # neither, and would have passed silently while covering 8 of the 10.
          projects=()
          for manifest in games/*/project.toml games/*/*/project.toml; do
            [ -e "$manifest" ] || continue
            projects+=("$(dirname "$manifest")")
          done
          if [ "${#projects[@]}" -eq 0 ]; then
            echo "no projects matched games/*/project.toml -- the glob is wrong"
            exit 1
          fi

          # Both modes: a project can cook cleanly and still fail to pack --
          # a .gltf that reads sibling files from disk cannot go in an archive,
          # and `--mode pak` is what says so.
          status=0
          for mode in loose pak; do
            for project in "${projects[@]}"; do
              out="$(mktemp -d)/dist"
              echo "::group::$project ($mode)"
              if "$bin" --package "$project" --out "$out" --mode "$mode"; then
                echo "PASS $project ($mode)"
              else
                echo "FAIL $project ($mode)"
                status=1
              fi
              echo "::endgroup::"
              rm -rf "$out"
            done
          done
          echo "packaged ${#projects[@]} project(s) in 2 mode(s)"
          exit $status
