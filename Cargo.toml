[workspace]
resolver = "2"
members = [
    "crates/bsengine-core",
    "crates/bsengine-ecs",
    "crates/bsengine-app",
    "crates/bsengine-window",
    "crates/bsengine-input",
    "crates/bsengine-rhi-wgpu",
    "crates/bsengine-render",
    "crates/bsengine-scene",
    "crates/bsengine-asset",
    "crates/bsengine-scripting",
    "crates/bsengine-physics",
    "crates/bsengine-audio",
    "crates/bsengine-plugin",
    "crates/bsengine-mcp",
    "crates/bsengine-gltf",
    "crates/bsengine-demo",
    "crates/bsengine-editor",
    "crates/bsengine-runtime",
    "games/cube-roller",
    "games/cube-evader",
    "crates/bsengine-network",
    "crates/bsengine-catalog",
    "crates/bsengine-shadergraph",
    "apps/bsengine-editor-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["blas1n"]
license = "MIT"

[workspace.dependencies]
bsengine-core     = { path = "crates/bsengine-core" }
bsengine-ecs      = { path = "crates/bsengine-ecs" }
bsengine-app      = { path = "crates/bsengine-app" }
bsengine-window   = { path = "crates/bsengine-window" }
bsengine-input    = { path = "crates/bsengine-input" }
bsengine-rhi-wgpu = { path = "crates/bsengine-rhi-wgpu" }
bsengine-render   = { path = "crates/bsengine-render" }
bsengine-scene    = { path = "crates/bsengine-scene" }
bsengine-asset    = { path = "crates/bsengine-asset" }
bsengine-scripting = { path = "crates/bsengine-scripting" }
bsengine-plugin   = { path = "crates/bsengine-plugin" }
bsengine-mcp      = { path = "crates/bsengine-mcp" }
toml              = "0.8"
deno_core         = "0.404.0"
serde_json        = "1.0"
ron               = "0.8"
serde             = { version = "1.0", features = ["derive"] }
bevy_app          = { version = "0.14", default-features = false, features = ["bevy_reflect"] }
bevy_ecs          = { version = "0.14", default-features = false, features = ["bevy_reflect"] }
bevy_reflect      = { version = "0.14", default-features = false }
bevy_asset        = { version = "0.14", default-features = false }
bevy_tasks        = { version = "0.14", default-features = false }
tracing           = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
winit             = "0.30"
wgpu              = "22"
pollster          = "0.3"
bytemuck          = { version = "1", features = ["derive"] }
glam              = "0.29"
# Version-agnostic maths interop. `kira`'s spatial API speaks `mint` rather than
# a specific `glam`, which is what lets this workspace stay on glam 0.29 while
# kira is on 0.33.
mint              = "0.5"
gltf              = "1"
image             = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr"] }
base64            = "0.22"
# Must stay on the version bevy_asset's own `file_watcher` feature requires, so
# the workspace never holds two copies of notify.
notify-debouncer-full = "0.3.1"
# Both already arrive transitively through bevy_asset; the versions here are the
# ones it resolves to, so naming them directly adds no second copy. blake3 hashes
# asset contents for change detection, uuid mints asset identities.
blake3            = "1.8.5"
uuid              = { version = "1.23", features = ["v4", "serde"] }
bsengine-gltf     = { path = "crates/bsengine-gltf" }
bsengine-runtime  = { path = "crates/bsengine-runtime" }
bsengine-editor   = { path = "crates/bsengine-editor" }
bsengine-physics  = { path = "crates/bsengine-physics" }
bsengine-audio    = { path = "crates/bsengine-audio" }
bsengine-network  = { path = "crates/bsengine-network" }
rapier3d          = { version = "0.33", features = ["default"] }
# kira splits container from codec: `wav`/`ogg` read the container while
# `pcm`/`vorbis` decode what is inside. Without the codecs both formats parse
# and then fail with "unsupported codec", which is what this engine shipped
# while advertising all four formats.
kira              = { version = "0.12", default-features = false, features = ["cpal", "wav", "pcm", "ogg", "vorbis", "mp3", "flac"] }
egui              = "0.29"
egui-wgpu         = "0.29"
egui_dock         = { version = "0.14", features = ["serde"] }
egui-phosphor     = { version = "0.7.3", default-features = false, features = ["regular"] }
gilrs             = "0.11"
bsengine-catalog  = { path = "crates/bsengine-catalog" }
bsengine-shadergraph = { path = "crates/bsengine-shadergraph" }
syn               = { version = "2", features = ["full", "extra-traits", "visit"] }
proc-macro2       = "1"
walkdir           = "2"
quote             = "1"
