[package]
name = "bsengine-bake"
description = "Offline lightmap baking: a BVH, a deterministic CPU path tracer and the atlas it fills"
version.workspace = true
edition.workspace = true

# No ECS: the baker takes plain triangles, lights and a sky and returns
# images, so it can be tested against closed-form answers in isolation and run
# from any front end (the runtime's `--bake`, later the editor and MCP).
[dependencies]
glam.workspace = true
# The GPU backend (`gpu`) and the shared GI scene layout (`gpu_scene`).
wgpu.workspace = true
bytemuck.workspace = true
# `native` only: the CPU bake's threads, and the GPU backend opening its own
# device by blocking on it. Neither exists in a browser, where the renderer
# uses this crate for `gpu_scene` alone.
rayon = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }

[features]
default = ["native"]
native = ["dep:rayon", "dep:pollster"]
