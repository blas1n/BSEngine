[package]
name = "bsengine-core"
description = "Shared primitives — math types, error handling, logging setup"
version.workspace = true
edition.workspace = true

[dependencies]
tracing.workspace = true
tracing-subscriber.workspace = true
bevy_ecs.workspace = true
bevy_reflect.workspace = true
glam.workspace = true
# `ReflectColor` carries Serialize/Deserialize so a scene can author a colour
# inside a reflected component. Without them the reflect deserializer has no
# ReflectDeserialize for the type and the whole component comes back absent.
serde.workspace = true
egui.workspace = true
# The operating system's locale, for a game's starting language.
sys-locale.workspace = true
# `clock`: `Instant`/`SystemTime` that work in a browser build.
web-time = "1"

# The browser build (wasm32-unknown-unknown) has no operating-system source
# of randomness, and the crates that ask for one refuse to compile until told
# to use the browser's `crypto.getRandomValues`. Named here, in the crate every
# build includes, so feature unification switches it on for the whole graph:
# getrandom 0.2 (bevy_utils) through `js`, 0.3 (ahash) through `wasm_js` plus
# the `getrandom_backend` cfg in `.cargo/config.toml`, and uuid's own `js`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
uuid = { workspace = true, features = ["js"] }
# The browser build's log goes to the page's console (`logging::init_logging`).
tracing-wasm = "0.2"

[dev-dependencies]
ron.workspace = true

# Native crash capture (see `crash::native`): a signal/SEH handler in the game
# and a minidump written by a second process, as Unity's UnityCrashHandler,
# Unreal's CrashReportClient and Crashpad all do.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crash-handler = "0.8"
minidumper = "0.11"
