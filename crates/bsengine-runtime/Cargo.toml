[package]
name = "bsengine-runtime"
description = "BSEngine project runner — loads project.toml and entry scene, no game-specific Rust required"
version.workspace = true
edition.workspace = true
authors.workspace = true

[[bin]]
name = "bsengine-runtime"
path = "src/main.rs"

[dependencies]
bevy_app           = { workspace = true }
bsengine-app       = { workspace = true }
bsengine-asset     = { workspace = true }
bsengine-audio     = { workspace = true }
bsengine-core      = { workspace = true }
bsengine-ecs       = { workspace = true }
bsengine-gltf      = { workspace = true }
bsengine-input     = { workspace = true }
bsengine-physics   = { workspace = true }
bsengine-render    = { workspace = true }
bsengine-rhi-wgpu  = { workspace = true }
bsengine-scene     = { workspace = true }
bsengine-network   = { workspace = true }
bsengine-editor    = { workspace = true }
bsengine-scripting = { workspace = true }
bsengine-window    = { workspace = true }
bevy_ecs        = { workspace = true }
kira            = { workspace = true }
ron             = { workspace = true }
serde           = { workspace = true }
serde_json      = { workspace = true }
toml            = { workspace = true }
tracing         = { workspace = true }

[dev-dependencies]
glam            = { workspace = true }
tempfile        = "3"
# The item-30 end-to-end test renames an asset while a real engine with the real
# `AssetWatcherPlugin` is running, against a real temp project. That needs the
# same probe-directory guard the watcher's own tests use — one that retries on
# Windows, where the watcher's handles can briefly refuse the removal — rather
# than a second `remove_dir_all` that would leave litter whenever it lost that
# race. Same arrangement `bsengine-scene` uses, and for the same reason.
bsengine-asset  = { workspace = true, features = ["test-support"] }
