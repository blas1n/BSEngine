[package]
name = "bsengine-scripting"
description = "JavaScript scripting runtime (V8 via Deno Core; QuickJS on mobile) with ECS op bindings"
version.workspace = true
edition.workspace = true

[dependencies]
bsengine-asset.workspace = true
bsengine-audio.workspace = true
bsengine-core.workspace = true
bsengine-network.workspace = true
bsengine-ecs.workspace = true
bsengine-input.workspace = true
bsengine-physics.workspace = true
bsengine-scene.workspace = true
kira = { workspace = true }
bevy_app.workspace = true
bevy_asset.workspace = true
bevy_ecs.workspace = true
# For `#[derive(TypePath)]` on `ScriptSource`: `bevy_asset::Asset` requires
# `TypePath`, and the derive lives in `bevy_reflect`.
bevy_reflect.workspace = true
bsengine-scripting-macros.workspace = true
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

# QuickJS in place of V8: on Android and iOS always (build.rs), on a desktop
# with this feature -- which is how the mobile engine is tested on the
# machines CI has. See `bsengine_quickjs` in build.rs.
rquickjs = { workspace = true, optional = true }

[features]
quickjs = ["dep:rquickjs"]

# Natively, scripts run in V8 through deno_core. A browser build has no V8
# (deno_core does not target wasm): scripts run in the page's own engine and
# reach the ops through wasm-bindgen exports. A mobile build has no V8 either
# (rusty_v8 ships no Android or iOS library): scripts run in QuickJS.
# `#[script_op]` binds each op to whichever this build has.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android", target_os = "ios")))'.dependencies]
deno_core.workspace = true

# `bindgen`: rquickjs-sys ships pregenerated bindings for desktop targets only,
# so a mobile build generates its own from QuickJS's header at build time --
# which needs libclang (LIBCLANG_PATH; scripts/build_android.sh sets it).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
rquickjs = { workspace = true, features = ["bindgen"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
js-sys.workspace = true
serde-wasm-bindgen.workspace = true

# The browser runtime's own tests (tests/browser_runtime.rs), run under
# wasm-bindgen-test.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
wasm-bindgen.workspace = true
js-sys.workspace = true

[dev-dependencies]
bsengine-catalog.workspace = true
# The visual scripting end-to-end test compiles a graph to JS and runs it
# through the real plugin: the graph crate is a leaf, so this is the one
# place the two meet.
bsengine-visualscript.workspace = true
# The demo-graph test reads the committed `.scriptgraph.ron` the way an author
# saved it, rather than rebuilding it as a literal.
ron.workspace = true
bsengine-app.workspace = true
# The prediction tests spawn a named, networked entity and drive a real
# movement script over it, which needs `Name` and `glam` directly.
bsengine-scene.workspace = true
glam.workspace = true
# The `Bsengine.spawn` tests read `GltfAsset` back off the entity the scene
# loader built, to check its path was joined onto `ProjectDir`; the component
# is `bsengine-gltf`'s, reached at runtime only through `bsengine-scene`.
bsengine-gltf.workspace = true
# The hot-reload tests drive a real `AssetWatcherPlugin` over a real project
# directory that has to be removed afterwards even when a test panics, and
# `ProbeDir`/`unique` are what the watcher's own tests use for exactly that —
# including the `.gitignore` entry that covers the name they mint.
bsengine-asset = { workspace = true, features = ["test-support"] }
# Only to capture `tracing` output in tests: the audio give-up path's whole
# point is that the warning reaches the developer, so a test that asserts on
# state alone would not cover it.
tracing-subscriber.workspace = true
