[package]
name = "bsengine-video"
description = "Video playback through each platform's own decoder"
version.workspace = true
edition.workspace = true

[dependencies]
tracing.workspace = true
bevy_app.workspace = true
bevy_ecs.workspace = true
bsengine-core.workspace = true
bsengine-audio.workspace = true
bsengine-asset.workspace = true

# Windows decodes through Media Foundation, as Unity's VideoPlayer and
# Unreal's WmfMedia do there: H.264/AAC (and whatever else the OS has codecs
# for) decoded by the platform, hardware-accelerated where it can be.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

# Linux decodes through GStreamer -- the platform's media framework, there
# being no decoder the OS itself guarantees. Opt-in (the `gstreamer`
# feature): building it needs GStreamer's development libraries installed,
# which an engine that only builds for other platforms -- or a Linux machine
# without them -- should not be made to have. Without it a Linux build
# reports "no decoder", as it did before.
[target.'cfg(target_os = "linux")'.dependencies]
gstreamer = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", optional = true }
gstreamer-pbutils = { version = "0.25", optional = true }

# The browser plays through its own video element.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Blob", "BlobPropertyBag", "CanvasRenderingContext2d", "Document", "Element",
    "EventTarget", "HtmlCanvasElement", "HtmlMediaElement", "HtmlVideoElement",
    "ImageData", "MediaError", "Url", "Window",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
bevy_app.workspace = true

[features]
gstreamer = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-pbutils"]

[dev-dependencies]
bsengine-app.workspace = true

# macOS decodes through AVFoundation (an AVAssetReader), as Unity's and
# Unreal's players do there.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media"] }
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-core-foundation = "0.3"
objc2-core-audio-types = "0.3"
