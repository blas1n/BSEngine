[package]
name = "bsengine-video"
description = "Video playback through each platform's own decoder"
version.workspace = true
edition.workspace = true

[dependencies]
tracing.workspace = true
bevy_app.workspace = true
bevy_ecs.workspace = true
bsengine-core.workspace = true
bsengine-audio.workspace = true
bsengine-asset.workspace = true

# Windows decodes through Media Foundation, as Unity's VideoPlayer and
# Unreal's WmfMedia do there: H.264/AAC (and whatever else the OS has codecs
# for) decoded by the platform, hardware-accelerated where it can be.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[dev-dependencies]
bsengine-app.workspace = true

# macOS decodes through AVFoundation (an AVAssetReader), as Unity's and
# Unreal's players do there.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media"] }
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-core-foundation = "0.3"
objc2-core-audio-types = "0.3"
