    "dep:critical-section",
    "portable-atomic/critical-section",
]
default = ["std"]
futures-lite = [
    "std",
    "dep:futures-lite",
    "futures-lite?/std",
]
rayon = [
    "dep:rayon",
    "hashbrown/rayon",
]
serialize = [
    "dep:serde",
    "hashbrown/serde",
]
std = [
    "alloc",
    "critical-section?/std",
    "portable-atomic/std",
    "portable-atomic-util/std",
    "spin/std",
    "foldhash/std",
    "serde?/std",
    "wasm-bindgen-futures?/std",
    "futures-channel/std",
    "wasm-bindgen?/std",
    "js-sys?/std",
]
web = [
    "dep:web-time",
    "dep:wasm-bindgen-futures",
    "dep:wasm-bindgen",
    "dep:js-sys",
]

[lib]
name = "bevy_platform"
path = "src/lib.rs"

[[test]]
name = "aligned_vec"
path = "tests/aligned_vec.rs"

[[test]]
name = "preferences_dir"
path = "tests/preferences_dir.rs"

[dependencies.async-io]
