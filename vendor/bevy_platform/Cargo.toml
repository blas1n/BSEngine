    "mutex",
    "spin_mutex",
    "rwlock",
    "once",
    "lazy",
    "barrier",
]
default-features = false

[dev-dependencies.bytemuck]
version = "1.5"
features = [
    "derive",
    "min_const_generics",
]
default-features = false

[target.'cfg(not(all(target_has_atomic = "8", target_has_atomic = "16", target_has_atomic = "32", target_has_atomic = "64", target_has_atomic = "ptr")))'.dependencies.portable-atomic]
