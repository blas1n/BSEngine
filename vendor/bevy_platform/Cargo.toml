[dependencies.foldhash]
version = "0.2.0"
default-features = false

[dependencies.futures-lite]
version = "2.0.1"
optional = true
default-features = false

[dependencies.hashbrown]
version = "0.16.1"
features = [
    "equivalent",
    "raw-entry",
]
optional = true
default-features = false

[dependencies.rayon]
version = "1"
optional = true
default-features = false

[dependencies.serde]
version = "1"
optional = true
default-features = false

[dependencies.spin]
