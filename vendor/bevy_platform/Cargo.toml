[package]
edition = "2024"
name = "bevy_platform"
version = "0.20.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Provides common platform agnostic APIs, as well as platform-specific features for Bevy Engine"
homepage = "https://bevy.org"
readme = "README.md"
keywords = ["bevy"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/bevyengine/bevy"

[package.metadata.docs.rs]
rustdoc-args = [
    "-Zunstable-options",
    "--generate-link-to-definition",
    "--generate-macro-expansion",
]
all-features = true

[features]
alloc = [
    "portable-atomic-util/alloc",
    "dep:hashbrown",
    "serde?/alloc",
]
async-io = [
    "std",
    "dep:async-io",
]
bytemuck = ["dep:bytemuck"]
