[package]
edition = "2021"
rust-version = "1.80"
name = "block_compression"
version = "0.11.0"
authors = ["Nils Hasenbanck <nils@hasenbanck.de>"]
build = false
exclude = ["tests/images/"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Texture block compression using WGPU compute shader"
documentation = "https://docs.rs/block_compression"
readme = "README.md"
keywords = [
    "texture",
    "image",
    "compress",
    "wgpu",
]
categories = [
    "rendering",
    "rendering::engine",
]
license = "MIT"
repository = "https://github.com/hasenbanck/block_compression"

